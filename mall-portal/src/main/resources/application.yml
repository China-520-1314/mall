spring:
  application:
    name: mall-portal
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-portal-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

secure:
  ignored:
    urls: #安全路径白名单
      - /swagger-ui/
      - /v3/api-docs/*
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /sso/**
      - /home/**
      - /product/search
      - /product/categoryTreeList
      - /product/detail/**
      - /product/*/comments
      - /product/*/commentSummary
      - /uploads/comments/**
      - /assistant/chat
      - /brand/**
      - /alipay/**
      - /wechatpay/notify

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 自定义redis key
redis:
  database: mall
  key:
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    common: 86400 # 24小时

# 邮箱验证码配置
verification:
  email:
    code-expire-seconds: 300
    cooldown-seconds: 10
    hourly-limit: 5
    max-attempts: 5

file:
  upload:
    comment-dir: ${MALL_COMMENT_UPLOAD_DIR:${user.home}/mall-uploads/comments}

# 智能客服：未配置密钥时自动使用本地商城问答。
ciyuanshen:
  base-url: ${CIYUANSHEN_BASE_URL:https://api.ciyuanshen.top/v1}
  api-key: ${CIYUANSHEN_API_KEY:}
  text-api-key: ${CIYUANSHEN_TEXT_API_KEY:}
  model: ${CIYUANSHEN_MODEL:gpt-5.6-terra}
  fallback-base-url: ${CIYUANSHEN_FALLBACK_BASE_URL:https://api.ciyuanshen.top/v1}
  fallback-api-key: ${CIYUANSHEN_FALLBACK_API_KEY:}
  fallback-model: ${CIYUANSHEN_FALLBACK_MODEL:claude-opus-5}
  timeout-seconds: ${CIYUANSHEN_TIMEOUT_SECONDS:30}
  max-history: ${CIYUANSHEN_MAX_HISTORY:8}
  max-message-length: ${CIYUANSHEN_MAX_MESSAGE_LENGTH:800}

# 可选易支付配置；全部配置后 /alipay/webPay 使用易支付跳转。
alipay:
  epayUrl: ${EPAY_URL:}
  epayPid: ${EPAY_PID:}
  epayKey: ${EPAY_KEY:}
  epayType: ${EPAY_TYPE:alipay}

wechat-pay:
  enabled: ${WECHAT_PAY_ENABLED:false}
  app-id: ${WECHAT_PAY_APP_ID:}
  mch-id: ${WECHAT_PAY_MCH_ID:}
  serial-no: ${WECHAT_PAY_SERIAL_NO:}
  private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
  private-key: ${WECHAT_PAY_PRIVATE_KEY:}
  api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
  notify-url: ${WECHAT_PAY_NOTIFY_URL:}


mongo:
  insert:
    sqlEnable: true # 用于控制是否通过数据库数据来插入mongo

# 消息队列定义
rabbitmq:
  cancel:
    enabled: true
  queue:
    name:
      cancelOrder: cancelOrderQueue
